name: Fluss (Latency)
driverClass: io.openmessaging.benchmark.driver.fluss.FlussBenchmarkDriver

schema: "long-long-long-long-long-long-long-long-string-string-string-string-string-string-string-string"

bootstrapServers: localhost:9123

# Security
securityProtocol: sasl
saslMechanism: PLAIN
saslUsername: <your-username>
saslPassword: <your-password>

logFormat: ARROW
arrowCompressionType: ZSTD
tieredLogLocalSegments: 2147483647

# Latency-optimized: small batch timeout for fast flush
writerAcks: all
writerIdempotenceEnabled: true
writerBatchSize: 2mb
writerBufferMemory: 64mb
writerBatchTimeoutMs: 1

# Consumer: full field read
prefetchNum: 4
fetchMaxBytes: 16mb
isCheckCrc: false

# Network
clientNettyThreads: 4
